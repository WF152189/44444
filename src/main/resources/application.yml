spring:
  application:
    name: aurora-routing-sample
  cloud:
    aws:
      region:
        static: ap-northeast-1
  jpa:
    open-in-view: false

app:
  db-mode:
    parameter-name: /myapp/prod/db-access-mode
    poll-interval: 2s
    grace-period: 20s
  datasource:
    writer:
      url: jdbc:mysql://YOUR_WRITER_ENDPOINT:3306/appdb
      username: app_user
      password: ${DB_PASSWORD}
      hikari:
        pool-name: writer-pool
        maximum-pool-size: 10
    reader:
      url: jdbc:mysql://YOUR_READER_ENDPOINT:3306/appdb
      username: app_user
      password: ${DB_PASSWORD}
      hikari:
        pool-name: reader-pool
        maximum-pool-size: 10
        read-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,dbmode
